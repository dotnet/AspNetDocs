name: Jekyll site CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  JEKYLL_ENV: production

jobs:
  build:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      pull-requests: write
      checks: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Jekyll site
      run: |
        docker run --rm \
          -e JEKYLL_ENV=production \
          -v ${{ github.workspace }}:/srv/jekyll \
          -v ${{ github.workspace }}/_site:/srv/jekyll/_site \
          jekyll/builder:latest \
          /bin/bash -c "chmod -R 777 /srv/jekyll && jekyll build --future --strict_front_matter"

    - name: Check build output
      if: always()
      run: |
        if [ -d "_site" ]; then
          echo "✅ Build successful. Site files generated."
          ls -la _site/ | head -20
        else
          echo "❌ Build failed. No _site directory found."
          exit 1
        fi

    - name: Upload build artifacts
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: jekyll-site
        path: _site/
        retention-days: 7
        if-no-files-found: warn

    - name: Comment on PR
      if: github.event_name == 'pull_request' && always()
      uses: actions/github-script@v7
      with:
        script: |
          const status = context.job.status;
          const emoji = status === 'success' ? '✅' : '❌';
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: `${emoji} Jekyll build ${status}. [View logs](${context.payload.pull_request.html_url}/checks)`
          })
